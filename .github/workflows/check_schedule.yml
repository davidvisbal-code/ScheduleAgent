name: Schedule agent

on:
  schedule:
    # Change detection: every 15 minutes. GitHub does not guarantee exact
    # timing -- under load this can lag 10-20 minutes. For true minute-level
    # freshness, run main.py in a loop on a small VPS instead (see README.md).
    - cron: "*/15 * * * *"
    # Morning digest: 7:00 AM Colombia time (UTC-5) = 12:00 UTC.
    - cron: "0 12 * * *"
    # Weekly planner: 6:00 AM Colombia time every Wednesday = 11:00 UTC.
    - cron: "0 11 * * 3"
  workflow_dispatch:
    inputs:
      script:
        description: "Which script to run manually"
        type: choice
        options: [main.py, send_digest.py, plan_week.py, list_accounts.py]
        default: main.py

env:
  COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
  WHATSAPP_TO_NUMBER: ${{ secrets.WHATSAPP_TO_NUMBER }}
  GMAIL_SCHOOL_ACCOUNT_ID: ${{ secrets.GMAIL_SCHOOL_ACCOUNT_ID }}
  GMAIL_PERSONAL_ACCOUNT_ID: ${{ secrets.GMAIL_PERSONAL_ACCOUNT_ID }}
  CALENDAR_SCHOOL_ACCOUNT_ID: ${{ secrets.CALENDAR_SCHOOL_ACCOUNT_ID }}
  CALENDAR_PERSONAL_ACCOUNT_ID: ${{ secrets.CALENDAR_PERSONAL_ACCOUNT_ID }}
  CLASSROOM_ACCOUNT_ID: ${{ secrets.CLASSROOM_ACCOUNT_ID }}
  WHATSAPP_ACCOUNT_ID: ${{ secrets.WHATSAPP_ACCOUNT_ID }}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Pick which script this trigger should run
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "script=${{ github.event.inputs.script }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 12 * * *" ]; then
            echo "script=send_digest.py" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 11 * * 3" ]; then
            echo "script=plan_week.py" >> "$GITHUB_OUTPUT"
          else
            echo "script=main.py" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ${{ steps.pick.outputs.script }}
        run: python ${{ steps.pick.outputs.script }}

      # state.json and digest_queue.json need to persist between runs --
      # commit them back to the repo (this bot account only ever touches
      # these two files, nothing else).
      - name: Save updated state
        run: |
          git config user.name "schedule-agent-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json digest_queue.json
          git diff --staged --quiet || git commit -m "update state [skip ci]"
          git push
