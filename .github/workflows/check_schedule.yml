name: Check schedule updates

on:
  schedule:
    # Every 15 minutes. GitHub does not guarantee exact timing -- under load
    # this can lag by 10-20 minutes. For true minute-level freshness, run
    # main.py in a loop on a small VPS instead (see README.md).
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab to test

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run schedule agent
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TO_NUMBER: ${{ secrets.WHATSAPP_TO_NUMBER }}
          GMAIL_SCHOOL_ACCOUNT_ID: ${{ secrets.GMAIL_SCHOOL_ACCOUNT_ID }}
          GMAIL_PERSONAL_ACCOUNT_ID: ${{ secrets.GMAIL_PERSONAL_ACCOUNT_ID }}
          CALENDAR_SCHOOL_ACCOUNT_ID: ${{ secrets.CALENDAR_SCHOOL_ACCOUNT_ID }}
          CALENDAR_PERSONAL_ACCOUNT_ID: ${{ secrets.CALENDAR_PERSONAL_ACCOUNT_ID }}
          CLASSROOM_ACCOUNT_ID: ${{ secrets.CLASSROOM_ACCOUNT_ID }}
          WHATSAPP_ACCOUNT_ID: ${{ secrets.WHATSAPP_ACCOUNT_ID }}
        run: python main.py

      # state.json needs to persist between runs -- commit it back to the repo.
      - name: Save updated state.json
        run: |
          git config user.name "schedule-agent-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "update state"
          git push
